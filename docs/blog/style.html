<style>
  :root{
    --fg:#1f2328; --muted:#57606a; --bg:#ffffff; --soft:#f6f8fa;
    --border:#d0d7de; --accent:#0b5fff; --accent-soft:#e8f0ff;
    --green:#1a7f37; --green-soft:#e6f4ea; --red:#cf222e; --red-soft:#ffebe9;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; color:var(--fg); background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
      "Noto Sans KR","Malgun Gothic",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px; line-height:1.75;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .wrap{max-width:760px; margin:0 auto; padding:64px 24px 96px}
  h1{font-size:2.1rem; line-height:1.3; letter-spacing:-.01em; margin:0 0 .6em; font-weight:800}
  h2{font-size:1.45rem; margin:2.4em 0 .7em; padding-top:.3em; font-weight:750;
     letter-spacing:-.01em; border-top:1px solid var(--border)}
  h2:first-of-type{border-top:0}
  h3{font-size:1.15rem; margin:1.8em 0 .5em; font-weight:700; color:var(--fg)}
  p{margin:0 0 1.1em}
  a{color:var(--accent); text-decoration:none}
  a:hover{text-decoration:underline}
  strong{font-weight:700}
  code{background:var(--soft); border:1px solid var(--border); border-radius:6px;
    padding:.12em .4em; font-size:.86em;
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  hr{border:0; border-top:1px solid var(--border); margin:3em 0}
  blockquote{
    margin:1.6em 0; padding:1em 1.3em; background:var(--soft);
    border-left:4px solid var(--accent); border-radius:0 8px 8px 0; color:var(--fg);
  }
  blockquote p{margin:.3em 0}
  blockquote strong{color:var(--accent)}
  table{border-collapse:collapse; width:100%; margin:1.6em 0; font-size:.95rem;
    border:1px solid var(--border); border-radius:10px; overflow:hidden}
  thead{background:var(--soft)}
  th,td{padding:.7em 1em; text-align:left; border-bottom:1px solid var(--border);
    vertical-align:top}
  th{font-weight:700}
  tr:last-child td{border-bottom:0}
  tbody tr:nth-child(even){background:#fbfcfd}
  ol,ul{margin:0 0 1.2em; padding-left:1.4em}
  li{margin:.4em 0}
  li::marker{color:var(--muted)}
  .meta{color:var(--muted); font-size:.92rem; margin-top:-.4em}
  em{color:var(--fg)}
  /* numeric tables: emphasize result cells */
  td strong{color:var(--green)}
  @media (max-width:600px){
    body{font-size:16px}
    .wrap{padding:40px 18px 72px}
    h1{font-size:1.7rem}
  }
  @media print{
    body{font-size:12pt}
    h2{border-top:1px solid #ccc}
    .wrap{max-width:none; padding:0}
  }
</style>
