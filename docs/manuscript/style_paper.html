<style>
  :root{
    --fg:#1a1a1a; --muted:#5b6470; --bg:#ffffff; --soft:#f6f8fa;
    --border:#d8dee4; --accent:#0b4f9c; --rule:#c7ced6;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; color:var(--fg); background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
      "Noto Sans KR",Georgia,"Times New Roman",serif;
    font-size:17px; line-height:1.7;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .wrap{max-width:820px; margin:0 auto; padding:56px 28px 110px}

  h1{font-size:1.95rem; line-height:1.28; letter-spacing:-.01em; font-weight:800;
     margin:0 0 .5em; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",
     "Pretendard","Noto Sans KR",Segoe UI,Roboto,sans-serif}
  h2{font-size:1.4rem; margin:2.3em 0 .6em; padding-bottom:.2em; font-weight:750;
     letter-spacing:-.01em; border-bottom:2px solid var(--rule);
     font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
     "Noto Sans KR",Segoe UI,Roboto,sans-serif}
  h3{font-size:1.13rem; margin:1.7em 0 .4em; font-weight:700;
     font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
     "Noto Sans KR",Segoe UI,Roboto,sans-serif}
  p{margin:0 0 1em; text-align:justify; -webkit-hyphens:auto; hyphens:auto}
  a{color:var(--accent); text-decoration:none}
  a:hover{text-decoration:underline}
  strong{font-weight:700}
  hr{border:0; border-top:1px solid var(--border); margin:2em 0}

  /* author/affiliation block: first paragraphs after h1 */
  h1 + p, h1 + p + p, h1 + p + p + p{text-align:left; margin:.2em 0}

  code{background:var(--soft); border:1px solid var(--border); border-radius:5px;
    padding:.1em .38em; font-size:.85em;
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}

  /* Abstract & callout blockquotes */
  blockquote{margin:1.4em 0; padding:.9em 1.2em; background:var(--soft);
    border-left:4px solid var(--accent); border-radius:0 8px 8px 0}
  blockquote p{text-align:left; margin:.3em 0}

  /* Figures */
  figure{margin:2em 0; text-align:center}
  img{max-width:100%; height:auto; border:1px solid var(--border); border-radius:8px;
    background:#fff}
  figcaption{margin-top:.7em; font-size:.88rem; color:var(--muted); line-height:1.5;
    text-align:left; padding:0 .4em}
  /* image alone in a paragraph (no implicit figure) */
  p > img{display:block; margin:1.6em auto .4em}

  /* Tables */
  table{border-collapse:collapse; width:100%; margin:1.6em 0; font-size:.9rem;
    border:1px solid var(--border); border-radius:8px; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
    "Noto Sans KR",Segoe UI,Roboto,sans-serif}
  thead{background:var(--soft)}
  th,td{padding:.55em .8em; text-align:left; border-bottom:1px solid var(--border);
    vertical-align:top; line-height:1.45}
  th{font-weight:700}
  tr:last-child td{border-bottom:0}
  tbody tr:nth-child(even){background:#fbfcfd}

  ol,ul{margin:0 0 1em; padding-left:1.5em}
  li{margin:.35em 0; text-align:justify}

  /* References: numbered, tighter, hanging look */
  h2[id*="reference" i] ~ ol li,
  h2[id*="참고" i] ~ ol li{font-size:.9rem; line-height:1.5; margin:.55em 0}

  sup{font-size:.7em}

  /* Table of contents */
  nav#TOC{margin:1.5em 0 2.5em; padding:1em 1.3em; background:var(--soft);
    border:1px solid var(--border); border-radius:10px; font-size:.92rem;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
    "Noto Sans KR",Segoe UI,Roboto,sans-serif}
  nav#TOC::before{content:"Contents"; display:block; font-weight:700;
    margin-bottom:.5em; color:var(--muted); font-size:.8rem; letter-spacing:.06em;
    text-transform:uppercase}
  nav#TOC:lang(ko)::before{content:"목차"; text-transform:none; letter-spacing:0}
  nav#TOC ul{list-style:none; padding-left:0; margin:0}
  nav#TOC ul ul{padding-left:1.2em}
  nav#TOC li{margin:.18em 0; text-align:left}
  nav#TOC a{color:var(--fg)}
  nav#TOC a:hover{color:var(--accent)}

  @media (max-width:620px){
    body{font-size:16px}
    .wrap{padding:36px 18px 80px}
    h1{font-size:1.6rem}
    p,li{text-align:left}
  }
  @media print{
    body{font-size:10.5pt; line-height:1.5}
    .wrap{max-width:none; padding:0}
    h2{border-bottom:1px solid #999}
    figure,img{break-inside:avoid}
    a{color:inherit}
  }
</style>
